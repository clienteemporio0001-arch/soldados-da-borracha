name: Replace boss music asset

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-boss-music-temp.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Pixabay track
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, sys, urllib.request
          page='https://pixabay.com/music/electronic-dark-fight-music-boss-142794/'
          req=urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','ignore')
          raw=html.unescape(raw)

          patterns=[
              r'https://cdn\.pixabay\.com/download/audio/[^"\'<> ]+?\.mp3[^"\'<> ]*',
              r'https://cdn\.pixabay\.com/audio/[^"\'<> ]+?\.mp3[^"\'<> ]*',
          ]
          urls=[]
          for pattern in patterns:
              urls.extend(re.findall(pattern, raw))

          target=None
          for url in urls:
              if '142794' in url or 'dark-fight-music-boss' in url:
                  target=url.replace('\\u0026','&')
                  break

          if not target and urls:
              target=urls[0].replace('\\u0026','&')

          if not target:
              print('No Pixabay MP3 URL found in official page HTML', file=sys.stderr)
              for token in re.findall(r'.{0,120}(?:142794|dark-fight-music-boss).{0,220}', raw, re.I)[:10]:
                  print(token, file=sys.stderr)
              sys.exit(2)

          print('Resolved official media URL:', target)
          req=urllib.request.Request(target, headers={'User-Agent':'Mozilla/5.0','Referer':page})
          data=urllib.request.urlopen(req, timeout=60).read()
          if len(data) < 500000:
              raise SystemExit(f'Downloaded file unexpectedly small: {len(data)} bytes')
          open('/tmp/dark-fight-music-boss-142794.mp3','wb').write(data)
          print('MP3 bytes:', len(data))
          PY

      - name: Convert MP3 to OGG
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /tmp/dark-fight-music-boss-142794.mp3
          ffmpeg -y -i /tmp/dark-fight-music-boss-142794.mp3 -vn -c:a libvorbis -q:a 5 public/assets/audio/music/music_boss.ogg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/assets/audio/music/music_boss.ogg

      - name: Commit boss music asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/music/music_boss.ogg
          if git diff --cached --quiet; then
            echo "No audio change detected"
            exit 0
          fi
          git commit -m "Replace boss music with Dark Fight Music Boss"
          git push
