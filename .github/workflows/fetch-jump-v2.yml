name: Fetch approved jump v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-jump-v2.yml

permissions:
  contents: write

jobs:
  fetch-jump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch exact Game-ish jump sound and convert to OGG
        run: |
          python - <<'PY'
          import json, re, urllib.request
          api = "https://www.101soundboards.com/api/v1/boards/699819"
          req = urllib.request.Request(api, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          sounds = data.get("sounds") or data.get("board", {}).get("sounds") or []
          target = None
          for s in sounds:
              transcript = str(s.get("sound_transcript", ""))
              if "Game Ish Jump Sound" in transcript and "SomeOrdinary" in transcript:
                  target = s
                  break
          if not target:
              for s in sounds:
                  transcript = str(s.get("sound_transcript", ""))
                  if "Game Ish Jump Sound" in transcript:
                      target = s
                      break
          if not target:
              raise SystemExit("Target sound not found in Jump SFX board")
          rel = target.get("sound_file_url")
          if not rel:
              raise SystemExit("Target sound has no sound_file_url")
          url = rel if rel.startswith("http") else "https://www.101soundboards.com" + rel
          print("Found sound:", target.get("id"), target.get("sound_transcript"))
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              audio = r.read()
          open("/tmp/player_jump_v2.mp3","wb").write(audio)
          print("Downloaded bytes:", len(audio))
          PY
          ffmpeg -y -hide_banner -loglevel error -i /tmp/player_jump_v2.mp3 -c:a libvorbis -q:a 5 public/assets/audio/player/player_jump_v2.ogg
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/assets/audio/player/player_jump_v2.ogg

      - name: Update jump manifest and license only
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest_path = Path("src/game/audio/audioManifest.js")
          text = manifest_path.read_text()
          dash_before = next(line for line in text.splitlines() if "player_dash:" in line)
          import re
          text, n1 = re.subn(
              r"^\s*player_jump:\s*\{[^\n]+\},$",
              "    player_jump: { category: 'sfx', path: 'audio/player/player_jump_v2.ogg', license: 'CC0-1.0', gain: 0.64, rate: 1.0 },",
              text, flags=re.M
          )
          text, n2 = re.subn(
              r"^\s*player_double_jump:\s*\{[^\n]+\},$",
              "    player_double_jump: { category: 'sfx', path: 'audio/player/player_jump_v2.ogg', license: 'CC0-1.0', gain: 0.64, rate: 1.0 },",
              text, flags=re.M
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unexpected jump manifest matches: {n1}, {n2}")
          dash_after = next(line for line in text.splitlines() if "player_dash:" in line)
          if dash_before != dash_after:
              raise SystemExit("player_dash changed unexpectedly")
          manifest_path.write_text(text)

          licenses_path = Path("public/assets/audio/LICENSES.md")
          licenses = licenses_path.read_text()
          row = "| `player/player_jump_v2.ogg` | `Game-ish jump sound.wav` | SomeOrdinaryDude | https://freesound.org/people/SomeOrdinaryDude/sounds/584350/ | CC0 / Public Domain | Freesound (public mirror used only to obtain the same sound bytes for conversion) |"
          if row not in licenses:
              marker = "| `player/jump.wav` | `jump.wav` | MoxieCat | https://opengameart.org/content/8-bit-platformer-sfx-0 | CC0 1.0 | OpenGameArt (espelho verificado: schulerj89/sphere-3d-game) |"
              if marker in licenses:
                  licenses = licenses.replace(marker, marker + "\n" + row)
              else:
                  licenses += "\n" + row + "\n"
              licenses_path.write_text(licenses)
          PY

      - name: Validate jump-only change
        run: |
          node --check src/game/audio/audioManifest.js
          node --check src/game/audio/AudioManager.js
          npm ci
          npm run build
          git diff --check
          grep "player_jump:" src/game/audio/audioManifest.js
          grep "player_double_jump:" src/game/audio/audioManifest.js
          grep "player_dash:" src/game/audio/audioManifest.js

      - name: Commit final jump asset and remove temporary workflow
        run: |
          rm .github/workflows/fetch-jump-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/player/player_jump_v2.ogg src/game/audio/audioManifest.js public/assets/audio/LICENSES.md .github/workflows/fetch-jump-v2.yml
          git commit -m "Substitui jump por efeito menos cartunesco"
          git push origin HEAD:main
