name: Fetch approved jump v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-jump-v2.yml

permissions:
  contents: write

jobs:
  fetch-jump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch exact Game-ish jump sound and convert to OGG
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          sound_page = "https://www.101soundboards.com/sounds/26904642-game-ish-jump-sound-jump-game-sound-effect-at-someordinary"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              response = page.goto(sound_page, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)
              print("Page status:", response.status if response else None)
              print("Page title:", page.title())

              candidates = []
              for selector in ["audio", "audio source"]:
                  for el in page.locator(selector).all():
                      src = el.get_attribute("src")
                      if src:
                          candidates.append(urljoin(sound_page, src))

              html = page.content()
              for pattern in [
                  r'"sound_file_url"\s*:\s*"([^"]+)"',
                  r'(\/storage\/board_sounds_rendered\/26904642[^"\\]+(?:\\u0026|&)[^"]+)',
                  r'(https://[^"\']+26904642[^"\']+\.mp3[^"\']*)'
              ]:
                  m = re.search(pattern, html)
                  if m:
                      candidates.append(urljoin(sound_page, m.group(1).replace("\\/","/").replace("\\u0026","&")))

              resources = page.evaluate("""() => performance.getEntriesByType('resource').map(e => e.name)""")
              candidates.extend([u for u in resources if "26904642" in u and (".mp3" in u or "/storage/" in u)])

              if not candidates:
                  try:
                      page.get_by_text("Play", exact=True).first.click(timeout=5000)
                      page.wait_for_timeout(3000)
                  except Exception:
                      pass
                  resources = page.evaluate("""() => performance.getEntriesByType('resource').map(e => e.name)""")
                  candidates.extend([u for u in resources if "26904642" in u and (".mp3" in u or "/storage/" in u)])

              candidates = list(dict.fromkeys(candidates))
              print("Candidates:", candidates)
              if not candidates:
                  raise SystemExit("Could not find target audio URL in browser session")

              audio = None
              for url in candidates:
                  try:
                      r = context.request.get(url, timeout=30000)
                      body = r.body()
                      print("Candidate response:", r.status, len(body), url)
                      if r.ok and len(body) > 1000:
                          audio = body
                          break
                  except Exception as exc:
                      print("Candidate failed:", exc)

              if not audio:
                  raise SystemExit("Could not download target audio in browser session")
              open("/tmp/player_jump_v2.mp3","wb").write(audio)
              browser.close()
          PY
          ffmpeg -y -hide_banner -loglevel error -i /tmp/player_jump_v2.mp3 -c:a libvorbis -q:a 5 public/assets/audio/player/player_jump_v2.ogg
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/assets/audio/player/player_jump_v2.ogg
      - name: Update jump manifest and license only
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest_path = Path("src/game/audio/audioManifest.js")
          text = manifest_path.read_text()
          dash_before = next(line for line in text.splitlines() if "player_dash:" in line)
          import re
          text, n1 = re.subn(
              r"^\s*player_jump:\s*\{[^\n]+\},$",
              "    player_jump: { category: 'sfx', path: 'audio/player/player_jump_v2.ogg', license: 'CC0-1.0', gain: 0.64, rate: 1.0 },",
              text, flags=re.M
          )
          text, n2 = re.subn(
              r"^\s*player_double_jump:\s*\{[^\n]+\},$",
              "    player_double_jump: { category: 'sfx', path: 'audio/player/player_jump_v2.ogg', license: 'CC0-1.0', gain: 0.64, rate: 1.0 },",
              text, flags=re.M
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unexpected jump manifest matches: {n1}, {n2}")
          dash_after = next(line for line in text.splitlines() if "player_dash:" in line)
          if dash_before != dash_after:
              raise SystemExit("player_dash changed unexpectedly")
          manifest_path.write_text(text)

          licenses_path = Path("public/assets/audio/LICENSES.md")
          licenses = licenses_path.read_text()
          row = "| `player/player_jump_v2.ogg` | `Game-ish jump sound.wav` | SomeOrdinaryDude | https://freesound.org/people/SomeOrdinaryDude/sounds/584350/ | CC0 / Public Domain | Freesound (public mirror used only to obtain the same sound bytes for conversion) |"
          if row not in licenses:
              marker = "| `player/jump.wav` | `jump.wav` | MoxieCat | https://opengameart.org/content/8-bit-platformer-sfx-0 | CC0 1.0 | OpenGameArt (espelho verificado: schulerj89/sphere-3d-game) |"
              if marker in licenses:
                  licenses = licenses.replace(marker, marker + "\n" + row)
              else:
                  licenses += "\n" + row + "\n"
              licenses_path.write_text(licenses)
          PY

      - name: Validate jump-only change
        run: |
          node --check src/game/audio/audioManifest.js
          node --check src/game/audio/AudioManager.js
          npm ci
          npm run build
          git diff --check
          grep "player_jump:" src/game/audio/audioManifest.js
          grep "player_double_jump:" src/game/audio/audioManifest.js
          grep "player_dash:" src/game/audio/audioManifest.js

      - name: Commit final jump asset and remove temporary workflow
        run: |
          rm .github/workflows/fetch-jump-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/player/player_jump_v2.ogg src/game/audio/audioManifest.js public/assets/audio/LICENSES.md .github/workflows/fetch-jump-v2.yml
          git commit -m "Substitui jump por efeito menos cartunesco"
          git push origin HEAD:main
