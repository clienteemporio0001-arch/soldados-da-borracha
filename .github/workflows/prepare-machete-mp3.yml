name: Prepare machete MP3 fallback

on:
  push:
    paths:
      - ".github/workflows/prepare-machete-mp3.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Convert fallback
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/audio/player/machete_swing_heavy.ogg \
            -ac 1 -ar 44100 \
            -c:a libmp3lame -q:a 4 \
            /tmp/machete_swing_heavy.mp3
          ffprobe -hide_banner -v error -show_entries format=duration,size -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/machete_swing_heavy.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: machete-mp3-fallback
          path: /tmp/machete_swing_heavy.mp3
          retention-days: 1
