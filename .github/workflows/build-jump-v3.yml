name: Build natural jump v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jump-v3.yml

permissions:
  contents: write

jobs:
  build-jump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download official Air Woosh Move
        run: |
          curl -fL --retry 3 --retry-delay 2             "https://opengameart.org/sites/default/files/air_move.wav"             -o /tmp/air_move.wav
          test -s /tmp/air_move.wav

      - name: Create short natural jump OGG
        run: |
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/air_move.wav             -af "silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.01,atrim=0:0.32,highpass=f=100,lowpass=f=6500,afade=t=out:st=0.24:d=0.08"             -ac 1 -c:a libvorbis -q:a 5             public/assets/audio/player/player_jump_v3.ogg
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1             public/assets/audio/player/player_jump_v3.ogg

      - name: Update jump manifest and license only
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path("src/game/audio/audioManifest.js")
          text = manifest_path.read_text()

          protected = {
              "dash": next(l for l in text.splitlines() if "player_dash:" in l),
              "step1": next(l for l in text.splitlines() if "player_step_01:" in l),
              "step2": next(l for l in text.splitlines() if "player_step_02:" in l),
              "step3": next(l for l in text.splitlines() if "player_step_03:" in l),
              "step4": next(l for l in text.splitlines() if "player_step_04:" in l),
              "land": next(l for l in text.splitlines() if "player_land:" in l),
              "fruit": next(l for l in text.splitlines() if "fruit_bite:" in l),
          }

          import re
          text, n1 = re.subn(
              r"^\s*player_jump:\s*\{[^\n]+\},$",
              "    player_jump: { category: 'sfx', path: 'audio/player/player_jump_v3.ogg', license: 'CC0-1.0', gain: 0.74, rate: 0.98 },",
              text, flags=re.M
          )
          text, n2 = re.subn(
              r"^\s*player_double_jump:\s*\{[^\n]+\},$",
              "    player_double_jump: { category: 'sfx', path: 'audio/player/player_jump_v3.ogg', license: 'CC0-1.0', gain: 0.74, rate: 0.98 },",
              text, flags=re.M
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unexpected jump manifest matches: {n1}, {n2}")

          for name, before in protected.items():
              after = next(l for l in text.splitlines() if {
                  "dash":"player_dash:",
                  "step1":"player_step_01:",
                  "step2":"player_step_02:",
                  "step3":"player_step_03:",
                  "step4":"player_step_04:",
                  "land":"player_land:",
                  "fruit":"fruit_bite:"
              }[name] in l)
              if before != after:
                  raise SystemExit(f"Protected audio changed: {name}")

          manifest_path.write_text(text)

          licenses_path = Path("public/assets/audio/LICENSES.md")
          licenses = licenses_path.read_text()
          row = "| `player/player_jump_v3.ogg` | `air_move.wav` | Almitory | https://opengameart.org/content/air-woosh-move | CC0 1.0 | OpenGameArt; trim curto, high-pass/low-pass e fade-out para jump |"
          if row not in licenses:
              anchor = "| `player/player_jump_v2.ogg` | `Game-ish jump sound.wav` | SomeOrdinaryDude | https://freesound.org/people/SomeOrdinaryDude/sounds/584350/ | CC0 / Public Domain | Freesound (preview HQ OGG do CDN oficial) |"
              if anchor in licenses:
                  licenses = licenses.replace(anchor, anchor + "\n" + row)
              else:
                  licenses += "\n" + row + "\n"
              licenses_path.write_text(licenses)
          PY

      - name: Validate jump-only change
        run: |
          node --check src/game/audio/audioManifest.js
          node --check src/game/audio/AudioManager.js
          npm ci
          npm run build
          git diff --check
          grep "player_jump:" src/game/audio/audioManifest.js
          grep "player_double_jump:" src/game/audio/audioManifest.js
          grep "player_dash:" src/game/audio/audioManifest.js
          grep "player_step_01:" src/game/audio/audioManifest.js
          grep "player_step_02:" src/game/audio/audioManifest.js
          grep "player_step_03:" src/game/audio/audioManifest.js
          grep "player_step_04:" src/game/audio/audioManifest.js
          grep "player_land:" src/game/audio/audioManifest.js

      - name: Commit final jump and remove temporary workflow
        run: |
          rm .github/workflows/build-jump-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/player/player_jump_v3.ogg src/game/audio/audioManifest.js public/assets/audio/LICENSES.md .github/workflows/build-jump-v3.yml
          git commit -m "Substitui jump por efeito natural de movimento"
          git push origin HEAD:main
