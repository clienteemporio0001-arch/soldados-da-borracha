name: Build audible jump v4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jump-v4.yml

permissions:
  contents: write

jobs:
  build-jump-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install audio tooling
        run: |
          python -m pip install --disable-pip-version-check numpy soundfile

      - name: Download official Air Woosh Move
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/air_move.wav" \
            -o /tmp/air_move.wav
          test -s /tmp/air_move.wav
          ls -lh /tmp/air_move.wav

      - name: Build and verify normalized V4
        run: |
          python - <<'PY'
          import math
          import numpy as np
          import soundfile as sf

          source = "/tmp/air_move.wav"
          output = "public/assets/audio/player/player_jump_v4.ogg"
          target_rate = 44100
          duration_s = 0.32
          pre_peak_s = 0.055
          fade_out_s = 0.055
          target_peak_db = -3.0

          audio, rate = sf.read(source, always_2d=True, dtype="float64")
          if audio.size == 0:
              raise SystemExit("Source WAV is empty")

          mono = audio.mean(axis=1)

          if rate != target_rate:
              old_x = np.linspace(0.0, 1.0, num=len(mono), endpoint=False)
              new_len = int(round(len(mono) * target_rate / rate))
              new_x = np.linspace(0.0, 1.0, num=new_len, endpoint=False)
              mono = np.interp(new_x, old_x, mono)
              rate = target_rate

          peak_index = int(np.argmax(np.abs(mono)))
          segment_len = int(round(duration_s * rate))
          start = max(0, peak_index - int(round(pre_peak_s * rate)))
          if start + segment_len > len(mono):
              start = max(0, len(mono) - segment_len)

          segment = mono[start:start + segment_len].copy()
          if len(segment) < segment_len:
              segment = np.pad(segment, (0, segment_len - len(segment)))

          fade_len = int(round(fade_out_s * rate))
          if fade_len > 1:
              segment[-fade_len:] *= np.linspace(1.0, 0.0, fade_len)

          current_peak = float(np.max(np.abs(segment)))
          if current_peak <= 1e-9:
              raise SystemExit("Selected segment is silent")

          target_peak = 10 ** (target_peak_db / 20.0)
          segment *= target_peak / current_peak
          segment = np.clip(segment, -1.0, 1.0)

          peak = float(np.max(np.abs(segment)))
          rms = float(np.sqrt(np.mean(segment ** 2)))
          peak_db = 20 * math.log10(peak) if peak > 0 else -120.0
          rms_db = 20 * math.log10(rms) if rms > 0 else -120.0

          sf.write(output, segment, rate, format="OGG", subtype="VORBIS")

          info = sf.info(output)
          decoded, decoded_rate = sf.read(output, always_2d=True, dtype="float64")
          decoded_peak = float(np.max(np.abs(decoded))) if decoded.size else 0.0
          decoded_rms = float(np.sqrt(np.mean(decoded ** 2))) if decoded.size else 0.0
          decoded_peak_db = 20 * math.log10(decoded_peak) if decoded_peak > 0 else -120.0
          decoded_rms_db = 20 * math.log10(decoded_rms) if decoded_rms > 0 else -120.0
          decoded_duration = len(decoded) / decoded_rate if decoded_rate else 0.0

          print(f"source_rate={rate}")
          print(f"source_peak_time={peak_index / rate:.4f}s")
          print(f"segment_start={start / rate:.4f}s")
          print(f"preencode_peak_db={peak_db:.2f}")
          print(f"preencode_rms_db={rms_db:.2f}")
          print(f"format={info.format}")
          print(f"subtype={info.subtype}")
          print(f"sample_rate={info.samplerate}")
          print(f"channels={info.channels}")
          print(f"duration={decoded_duration:.4f}s")
          print(f"decoded_peak_db={decoded_peak_db:.2f}")
          print(f"decoded_rms_db={decoded_rms_db:.2f}")

          if info.format != "OGG" or info.subtype != "VORBIS":
              raise SystemExit(f"Wrong codec/container: {info.format}/{info.subtype}")
          if info.samplerate != 44100 or info.channels != 1:
              raise SystemExit(f"Wrong audio format: {info.samplerate} Hz, {info.channels} ch")
          if not (0.25 <= decoded_duration <= 0.40):
              raise SystemExit(f"Wrong duration: {decoded_duration:.4f}s")
          if not (-3.8 <= decoded_peak_db <= -2.2):
              raise SystemExit(f"Decoded peak outside expected normalized range: {decoded_peak_db:.2f} dB")
          if decoded_rms_db < -28:
              raise SystemExit(f"Jump still too quiet: RMS {decoded_rms_db:.2f} dB")
          PY

      - name: Update manifest preloader and license
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path("src/game/audio/audioManifest.js")
          manifest = manifest_path.read_text()

          protected = {}
          for key in ["player_dash", "player_step_01", "player_step_02", "player_step_03", "player_step_04", "player_land", "fruit_bite"]:
              protected[key] = next(line for line in manifest.splitlines() if f"{key}:" in line)

          manifest, n1 = re.subn(
              r"^\s*player_jump:\s*\{[^\n]+\},$",
              "    player_jump: { category: 'sfx', path: 'audio/player/player_jump_v4.ogg', license: 'CC0-1.0', gain: 0.95, rate: 1.0 },",
              manifest, flags=re.M
          )
          manifest, n2 = re.subn(
              r"^\s*player_double_jump:\s*\{[^\n]+\},$",
              "    player_double_jump: { category: 'sfx', path: 'audio/player/player_jump_v4.ogg', license: 'CC0-1.0', gain: 0.95, rate: 1.0 },",
              manifest, flags=re.M
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unexpected jump manifest matches: {n1}, {n2}")

          for key, before in protected.items():
              after = next(line for line in manifest.splitlines() if f"{key}:" in line)
              if after != before:
                  raise SystemExit(f"Protected audio changed: {key}")

          manifest_path.write_text(manifest)

          preloader_path = Path("src/game/scenes/Preloader.js")
          preloader = preloader_path.read_text()
          old = "?v=jump-approved-2"
          new = "?v=jump-v4-20261001"
          if old not in preloader and new not in preloader:
              raise SystemExit("Expected jump cache token not found")
          preloader = preloader.replace(old, new)
          preloader_path.write_text(preloader)

          licenses_path = Path("public/assets/audio/LICENSES.md")
          licenses = licenses_path.read_text()
          row = "| `player/player_jump_v4.ogg` | `air_move.wav` | Almitory | https://opengameart.org/content/air-woosh-move | CC0 1.0 | OpenGameArt; trecho de maior ataque, 0.32 s, Vorbis 44.1 kHz mono, pico normalizado a -3 dB, fade-out curto |"
          if row not in licenses:
              anchor = "| `player/player_jump_v3.ogg` | `air_move.wav` | Almitory | https://opengameart.org/content/air-woosh-move | CC0 1.0 | Corte curto derivado do Air Woosh Move: 0,32 s, mono, low-pass e fade-out |"
              if anchor in licenses:
                  licenses = licenses.replace(anchor, anchor + "\n" + row)
              else:
                  licenses += "\n" + row + "\n"
              licenses_path.write_text(licenses)
          PY

      - name: Validate code and build
        run: |
          node --check src/game/audio/audioManifest.js
          node --check src/game/audio/AudioManager.js
          node --check src/game/scenes/Preloader.js
          npm ci
          npm run build
          git diff --check

          grep "player_jump:" src/game/audio/audioManifest.js
          grep "player_double_jump:" src/game/audio/audioManifest.js
          grep "player_dash:" src/game/audio/audioManifest.js
          grep "jump-v4-20261001" src/game/scenes/Preloader.js

      - name: Commit V4 and remove temporary workflow
        run: |
          rm .github/workflows/build-jump-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/player/player_jump_v4.ogg \
            src/game/audio/audioManifest.js \
            src/game/scenes/Preloader.js \
            public/assets/audio/LICENSES.md \
            .github/workflows/build-jump-v4.yml
          git commit -m "Corrige reproducao do som de jump"
          git push origin HEAD:main
