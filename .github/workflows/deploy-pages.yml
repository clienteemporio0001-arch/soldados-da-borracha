name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Normalize WALK sprite
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/normalize_walk.py

      - name: Persist normalized WALK on main
        run: |
          if ! git diff --quiet -- public/assets/walk.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets/walk.png
            git commit -m "Normaliza walk para escala do idle [skip ci]"
            git push origin HEAD:main
          else
            echo "walk.png já está normalizado."
          fi

      - name: Build game
        run: npm run build

      - name: Verify machete audio in final build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';

          const files = [
            'public/assets/audio/player/blade_01.ogg',
            'public/assets/audio/player/blade_02.ogg',
            'dist/assets/audio/player/blade_01.ogg',
            'dist/assets/audio/player/blade_02.ogg'
          ];

          for (const file of files) {
              const size = statSync(file).size;
              if (size <= 0) throw new Error(`Empty audio file: ${file}`);
              const header = readFileSync(file, { start: 0, end: 3 }).subarray(0, 4).toString('ascii');
              if (header !== 'OggS') throw new Error(`Invalid OGG header: ${file}`);
              console.log(`VERIFY ${file} size=${size} header=${header}`);
          }
          NODE
          test "$(sha256sum public/assets/audio/player/blade_01.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_01.ogg | cut -d' ' -f1)"
          test "$(sha256sum public/assets/audio/player/blade_02.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_02.ogg | cut -d' ' -f1)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  smoke-test-audio:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup browser test tools
        run: |
          set -euo pipefail
          command -v google-chrome-stable || true
          command -v google-chrome || true
          google-chrome-stable --version || true
          google-chrome --version || true
          ls -l /opt/google/chrome/chrome /opt/google/chrome/google-chrome 2>/dev/null || true
          python -m pip install --disable-pip-version-check playwright

      - name: Test published machete audio on desktop and mobile
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import time
          from playwright.async_api import async_playwright

          BASE = 'https://clienteemporio0001-arch.github.io/soldados-da-borracha/'

          def chrome_binary():
              candidates = [
                  '/opt/google/chrome/chrome',
                  '/opt/google/chrome/google-chrome',
                  shutil.which('google-chrome-stable'),
                  shutil.which('google-chrome'),
              ]
              for candidate in candidates:
                  if candidate and os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return candidate
              raise RuntimeError(f'No executable Chrome binary found: {candidates}')

          async def open_game(browser, touch=False):
              context = await browser.new_context(
                  viewport={'width': 1024, 'height': 768},
                  has_touch=touch
              )
              page = await context.new_page()
              page.on('console', lambda msg: print('[BROWSER CONSOLE]', msg.type, msg.text))
              url = BASE + '?audio-test=1&cache=' + str(time.time_ns())
              response = await page.goto(url, wait_until='networkidle', timeout=30000)
              assert response is not None and response.status == 200, f'Game page HTTP {response.status if response else None}'
              await page.wait_for_function(
                  "() => !!window.__soldadosAudioTestGame && window.__soldadosAudioTestGame.scene.isActive('MainMenu')",
                  timeout=30000
              )
              await page.evaluate("""() => {
                  const game=window.__soldadosAudioTestGame;
                  const menu=game.scene.getScene('MainMenu');
                  menu.scene.start('Game');
              }""")
              await page.wait_for_function(
                  """() => {
                      const game=window.__soldadosAudioTestGame;
                      const s=game.scene.getScene('Game');
                      return !!s && s.scene.isActive() && !game.scene.isActive('MainMenu') &&
                          !!s.audioManager && s.cache.audio.exists('player_machete_swing');
                  }""",
                  timeout=30000
              )
              canvas = page.locator('canvas')
              await canvas.click(position={'x': 512, 'y': 384})
              await page.wait_for_timeout(250)
              return context, page, canvas

          async def main():
              executable = chrome_binary()
              print('[BROWSER BINARY]', executable)

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      executable_path=executable,
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--autoplay-policy=user-gesture-required'
                      ]
                  )
                  try:
                      context, page, _ = await open_game(browser, touch=False)
                      try:
                          direct = await page.evaluate("""async () => {
                              const game = window.__soldadosAudioTestGame;
                              const scene = game.scene.getScene('Game');
                              const response = await fetch('assets/audio/player/blade_01.ogg?smoke=1', {cache:'no-store'});
                              const data = await response.arrayBuffer();
                              const decoded = await scene.sound.context.decodeAudioData(data.slice(0));
                              let peak = 0;
                              let sumSquares = 0;
                              let sampleCount = 0;
                              for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
                                  const samples = decoded.getChannelData(channel);
                                  for (let i = 0; i < samples.length; i++) {
                                      const value = Math.abs(samples[i]);
                                      if (value > peak) peak = value;
                                      sumSquares += samples[i] * samples[i];
                                      sampleCount++;
                                  }
                              }
                              const rms = sampleCount ? Math.sqrt(sumSquares / sampleCount) : 0;
                              const before = {
                                  cached: scene.cache.audio.exists('player_machete_swing'),
                                  soundLocked: scene.sound.locked,
                                  contextState: scene.sound.context?.state ?? null,
                                  soundsLevel: scene.audioManager?.getSoundsLevel?.() ?? null,
                                  httpStatus: response.status,
                                  bytes: data.byteLength,
                                  duration: decoded.duration,
                                  channels: decoded.numberOfChannels,
                                  peak,
                                  rms
                              };
                              const directResult = scene.sound.play('player_machete_swing', {volume:1});
                              await new Promise(r => setTimeout(r, 80));
                              scene.audioManager.bindScene(scene);
                              const managerResult = scene.audioManager.playSfx('player_machete_swing', {
                                  volume:1,
                                  cooldown:0
                              });
                              return {
                                  ...before,
                                  directOk: directResult !== false && directResult != null,
                                  managerOk: managerResult !== false && managerResult != null,
                                  directType: typeof directResult,
                                  managerType: typeof managerResult
                              };
                          }""")
                          print('[MACHETE TEST]', json.dumps(direct, sort_keys=True))
                          assert direct['httpStatus'] == 200, direct
                          assert direct['bytes'] > 0, direct
                          assert direct['cached'] is True, direct
                          assert direct['contextState'] == 'running', direct
                          assert direct['soundsLevel'] > 0, direct
                          assert direct['peak'] > 0.001, direct
                          assert direct['rms'] > 0.0001, direct
                          assert direct['directOk'] is True, direct
                          assert direct['managerOk'] is True, direct

                          await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.__macheteTestCalls=0;
                              scene.__macheteOriginalPlaySfx=scene.audioManager.playSfx.bind(scene.audioManager);
                              scene.audioManager.playSfx=(key,options={})=>{
                                  if(key==='player_machete_swing') scene.__macheteTestCalls++;
                                  return scene.__macheteOriginalPlaySfx(key,options);
                              };
                          }""")
                          await page.keyboard.press('J')
                          await page.wait_for_timeout(150)
                          keyboard = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {calls:scene.__macheteTestCalls, attacking:scene.isAttacking};
                          }""")
                          print('[MACHETE KEYBOARD]', json.dumps(keyboard, sort_keys=True))
                          assert keyboard['calls'] == 1, keyboard
                      finally:
                          await context.close()

                      context, page, canvas = await open_game(browser, touch=True)
                      try:
                          mobile_state = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.__macheteTestCalls=0;
                              scene.__macheteOriginalPlaySfx=scene.audioManager.playSfx.bind(scene.audioManager);
                              scene.audioManager.playSfx=(key,options={})=>{
                                  if(key==='player_machete_swing') scene.__macheteTestCalls++;
                                  return scene.__macheteOriginalPlaySfx(key,options);
                              };
                              return {isTouchDevice:scene.isTouchDevice};
                          }""")
                          assert mobile_state['isTouchDevice'] is True, mobile_state
                          box = await canvas.bounding_box()
                          assert box, 'Canvas bounding box missing'
                          tap_position = {
                              'x': (846 / 1024) * box['width'],
                              'y': (592 / 768) * box['height']
                          }
                          await page.evaluate("""() => {
                              window.__macheteTouchDiag=[];
                              const canvas=document.querySelector('canvas');
                              ['pointerdown','pointerup','touchstart','touchend'].forEach(type=>{
                                  canvas.addEventListener(type,(event)=>{
                                      const point=event.touches?.[0] ?? event.changedTouches?.[0] ?? event;
                                      window.__macheteTouchDiag.push({
                                          type,
                                          x:point?.clientX ?? null,
                                          y:point?.clientY ?? null,
                                          pointerType:event.pointerType ?? null
                                      });
                                  }, {passive:true});
                              });
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.input.on('pointerdown',(pointer)=>{
                                  window.__macheteTouchDiag.push({
                                      type:'phaser-pointerdown',
                                      x:pointer.x,
                                      y:pointer.y,
                                      wasTouch:pointer.wasTouch
                                  });
                              });
                          }""")
                          await canvas.tap(position=tap_position)
                          await page.wait_for_timeout(150)
                          touch = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {
                                  calls:scene.__macheteTestCalls,
                                  attacking:scene.isAttacking,
                                  mobileAttack:scene.mobileInput?.attack,
                                  diag:window.__macheteTouchDiag
                              };
                          }""")
                          print('[MACHETE MOBILE]', json.dumps(touch, sort_keys=True))
                          assert touch['calls'] == 1, touch
                      finally:
                          await context.close()
                  finally:
                      await browser.close()

          asyncio.run(main())
          PY
