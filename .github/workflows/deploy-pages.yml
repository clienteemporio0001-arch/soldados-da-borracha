name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Normalize WALK sprite
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/normalize_walk.py

      - name: Persist normalized WALK on main
        run: |
          if ! git diff --quiet -- public/assets/walk.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets/walk.png
            git commit -m "Normaliza walk para escala do idle [skip ci]"
            git push origin HEAD:main
          else
            echo "walk.png já está normalizado."
          fi

      - name: Build game
        run: npm run build

      - name: Verify machete audio in final build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';

          const files = [
            'public/assets/audio/player/blade_01.ogg',
            'public/assets/audio/player/blade_02.ogg',
            'dist/assets/audio/player/blade_01.ogg',
            'dist/assets/audio/player/blade_02.ogg'
          ];

          for (const file of files) {
              const size = statSync(file).size;
              if (size <= 0) throw new Error(`Empty audio file: ${file}`);
              const header = readFileSync(file, { start: 0, end: 3 }).subarray(0, 4).toString('ascii');
              if (header !== 'OggS') throw new Error(`Invalid OGG header: ${file}`);
              console.log(`VERIFY ${file} size=${size} header=${header}`);
          }
          NODE
          test "$(sha256sum public/assets/audio/player/blade_01.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_01.ogg | cut -d' ' -f1)"
          test "$(sha256sum public/assets/audio/player/blade_02.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_02.ogg | cut -d' ' -f1)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  smoke-test-audio:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup browser test tools
        run: |
          set -euo pipefail
          command -v google-chrome-stable || true
          command -v google-chrome || true
          google-chrome-stable --version || true
          google-chrome --version || true
          ls -l /opt/google/chrome/chrome /opt/google/chrome/google-chrome 2>/dev/null || true
          python -m pip install --disable-pip-version-check playwright

      - name: Test published machete audio on desktop and mobile
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import time
          from playwright.async_api import async_playwright

          BASE = 'https://clienteemporio0001-arch.github.io/soldados-da-borracha/'

          def chrome_binary():
              candidates = [
                  '/opt/google/chrome/chrome',
                  '/opt/google/chrome/google-chrome',
                  shutil.which('google-chrome-stable'),
                  shutil.which('google-chrome'),
              ]
              for candidate in candidates:
                  if candidate and os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return candidate
              raise RuntimeError(f'No executable Chrome binary found: {candidates}')

          async def open_game(browser, touch=False):
              context = await browser.new_context(
                  viewport={'width': 1024, 'height': 768},
                  has_touch=touch
              )
              page = await context.new_page()
              page.on('console', lambda msg: print('[BROWSER CONSOLE]', msg.type, msg.text))
              url = BASE + '?audio-test=1&cache=' + str(time.time_ns())
              response = await page.goto(url, wait_until='networkidle', timeout=30000)
              assert response is not None and response.status == 200, f'Game page HTTP {response.status if response else None}'
              await page.wait_for_function(
                  "() => !!window.__soldadosAudioTestGame && window.__soldadosAudioTestGame.scene.isActive('MainMenu')",
                  timeout=30000
              )
              await page.evaluate("""() => {
                  const game=window.__soldadosAudioTestGame;
                  const menu=game.scene.getScene('MainMenu');
                  menu.scene.start('Game');
              }""")
              await page.wait_for_function(
                  """() => {
                      const game=window.__soldadosAudioTestGame;
                      const s=game.scene.getScene('Game');
                      return !!s && s.scene.isActive() && !game.scene.isActive('MainMenu') &&
                          !!s.audioManager && s.cache.audio.exists('player_machete_swing');
                  }""",
                  timeout=30000
              )

              # Do not gate the audio smoke test on camera.renderList.
              # Chrome headless can keep Phaser's renderList empty even when the
              # scene, cache and WebAudio system are fully initialized.
              canvas = page.locator('canvas')
              await canvas.click(position={'x': 512, 'y': 384})
              await page.wait_for_timeout(250)
              return context, page, canvas

          async def main():
              executable = chrome_binary()
              print('[BROWSER BINARY]', executable)

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      executable_path=executable,
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--autoplay-policy=user-gesture-required'
                      ]
                  )
                  try:
                      context, page, _ = await open_game(browser, touch=False)
                      try:
                          direct = await page.evaluate("""async () => {
                              const game = window.__soldadosAudioTestGame;
                              const scene = game.scene.getScene('Game');
                              const response = await fetch('assets/audio/player/blade_01.ogg?smoke=1', {cache:'no-store'});
                              const data = await response.arrayBuffer();
                              const decoded = await scene.sound.context.decodeAudioData(data.slice(0));
                              let peak = 0;
                              let sumSquares = 0;
                              let sampleCount = 0;
                              for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
                                  const samples = decoded.getChannelData(channel);
                                  for (let i = 0; i < samples.length; i++) {
                                      const value = Math.abs(samples[i]);
                                      if (value > peak) peak = value;
                                      sumSquares += samples[i] * samples[i];
                                      sampleCount++;
                                  }
                              }
                              const rms = sampleCount ? Math.sqrt(sumSquares / sampleCount) : 0;
                              const asset = scene.audioManager ? scene.audioManager.constructor?.name : null;
                              const before = {
                                  cached: scene.cache.audio.exists('player_machete_swing'),
                                  soundLocked: scene.sound.locked,
                                  contextState: scene.sound.context?.state ?? null,
                                  masterVolume: scene.audioManager?.volumes?.master ?? null,
                                  sfxVolume: scene.audioManager?.volumes?.sfx ?? null,
                                  soundsLevel: scene.audioManager?.getSoundsLevel?.() ?? null,
                                  calculatedVolume: scene.audioManager?.categoryVolume?.('sfx', 0.82) ?? null,
                                  httpStatus: response.status,
                                  bytes: data.byteLength,
                                  duration: decoded.duration,
                                  channels: decoded.numberOfChannels,
                                  peak,
                                  rms,
                                  managerClass: asset
                              };

                              const directBeforeCount = scene.sound.sounds?.length ?? null;
                              const directResult = scene.sound.play('player_machete_swing', {volume:1});
                              await new Promise(r => setTimeout(r, 80));
                              const directSounds = scene.sound.sounds?.filter?.(s => s.key === 'player_machete_swing') ?? [];
                              const directSound = directSounds.at?.(-1) ?? directSounds[directSounds.length - 1] ?? null;

                              scene.audioManager.bindScene(scene);
                              const managerResult = scene.audioManager.playSfx('player_machete_swing', {
                                  volume:1,
                                  cooldown:0
                              });
                              await new Promise(r => setTimeout(r, 80));
                              const managerSounds = scene.sound.sounds?.filter?.(s => s.key === 'player_machete_swing') ?? [];
                              const managerSound = managerSounds.at?.(-1) ?? managerSounds[managerSounds.length - 1] ?? null;

                              return {
                                  ...before,
                                  directOk: directResult !== false && directResult != null,
                                  managerOk: managerResult !== false && managerResult != null,
                                  directType: typeof directResult,
                                  managerType: typeof managerResult,
                                  directBeforeCount,
                                  directSoundCreated: !!directSound,
                                  directIsPlaying: directSound?.isPlaying ?? null,
                                  managerSoundCreated: !!managerSound,
                                  managerIsPlaying: managerSound?.isPlaying ?? null,
                                  soundCountAfter: scene.sound.sounds?.length ?? null
                              };
                          }""")
                          print('[MACHETE TEST]', json.dumps(direct, sort_keys=True))
                          assert direct['httpStatus'] == 200, direct
                          assert direct['bytes'] > 0, direct
                          assert direct['cached'] is True, direct
                          assert direct['contextState'] == 'running', direct
                          assert direct['masterVolume'] > 0, direct
                          assert direct['sfxVolume'] > 0, direct
                          assert direct['soundsLevel'] > 0, direct
                          assert direct['calculatedVolume'] > 0, direct
                          assert direct['peak'] > 0.001, direct
                          assert direct['rms'] > 0.0001, direct
                          assert direct['directOk'] is True, direct
                          assert direct['managerOk'] is True, direct
                          assert direct['directSoundCreated'] is True, direct
                          assert direct['managerSoundCreated'] is True, direct

                          await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.__macheteTestCalls=0;
                              scene.__macheteOriginalPlaySfx=scene.audioManager.playSfx.bind(scene.audioManager);
                              scene.audioManager.playSfx=(key,options={})=>{
                                  if(key==='player_machete_swing') scene.__macheteTestCalls++;
                                  return scene.__macheteOriginalPlaySfx(key,options);
                              };
                          }""")
                          await page.keyboard.press('J')
                          await page.wait_for_timeout(150)
                          keyboard = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {calls:scene.__macheteTestCalls, attacking:scene.isAttacking};
                          }""")
                          print('[MACHETE KEYBOARD]', json.dumps(keyboard, sort_keys=True))
                          assert keyboard['calls'] == 1, keyboard
                      finally:
                          await context.close()

                      context, page, canvas = await open_game(browser, touch=True)
                      try:
                          mobile_state = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.__macheteTestCalls=0;
                              scene.__macheteOriginalPlaySfx=scene.audioManager.playSfx.bind(scene.audioManager);
                              scene.audioManager.playSfx=(key,options={})=>{
                                  if(key==='player_machete_swing') scene.__macheteTestCalls++;
                                  return scene.__macheteOriginalPlaySfx(key,options);
                              };

                              const describe=(object)=>({
                                  type:object?.type ?? null,
                                  x:object?.x ?? null,
                                  y:object?.y ?? null,
                                  depth:object?.depth ?? null,
                                  visible:object?.visible ?? null,
                                  active:object?.active ?? null,
                                  inputEnabled:object?.input?.enabled ?? null,
                                  hitAreaType:object?.input?.hitArea?.type ?? object?.input?.hitArea?.constructor?.name ?? null,
                                  hitAreaX:object?.input?.hitArea?.x ?? null,
                                  hitAreaY:object?.input?.hitArea?.y ?? null,
                                  hitAreaWidth:object?.input?.hitArea?.width ?? null,
                                  hitAreaHeight:object?.input?.hitArea?.height ?? null,
                                  hitAreaRadius:object?.input?.hitArea?.radius ?? null,
                                  hitAreaCallbackType:typeof object?.input?.hitAreaCallback,
                                  centerHit:(()=>{
                                      try {
                                          return object?.input?.hitAreaCallback?.(
                                              object.input.hitArea,
                                              object.displayOriginX,
                                              object.displayOriginY,
                                              object
                                          ) ?? null;
                                      } catch(error) {
                                          return 'ERROR:'+String(error);
                                      }
                                  })(),
                                  displayOriginX:object?.displayOriginX ?? null,
                                  displayOriginY:object?.displayOriginY ?? null,
                                  scrollFactorX:object?.scrollFactorX ?? null,
                                  scrollFactorY:object?.scrollFactorY ?? null,
                                  displayWidth:object?.displayWidth ?? null,
                                  displayHeight:object?.displayHeight ?? null
                              });

                              const candidates=scene.children.list
                                  .filter(object=>Math.abs((object?.x ?? -9999)-846)<1 && Math.abs((object?.y ?? -9999)-592)<1)
                                  .map(describe);
                              const interactive=(scene.input?._list ?? [])
                                  .filter(object=>Math.abs((object?.x ?? -9999)-846)<80 && Math.abs((object?.y ?? -9999)-592)<80)
                                  .map(describe);

                              return {
                                  isTouchDevice:scene.isTouchDevice,
                                  inputEnabled:scene.input.enabled,
                                  topOnly:scene.input.topOnly,
                                  camera:{
                                      inputEnabled:scene.cameras.main.inputEnabled,
                                      disableCull:scene.cameras.main.disableCull,
                                      scrollX:scene.cameras.main.scrollX,
                                      scrollY:scene.cameras.main.scrollY,
                                      renderListSize:scene.cameras.main.renderList?.length ?? null,
                                      attackInRenderList:scene.cameras.main.renderList?.some?.(
                                          object=>Math.abs((object?.x ?? -9999)-846)<1 && Math.abs((object?.y ?? -9999)-592)<1
                                      ) ?? null
                                  },
                                  candidates,
                                  interactive
                              };
                          }""")
                          print('[MACHETE MOBILE STATE]', json.dumps(mobile_state, sort_keys=True))
                          assert mobile_state['isTouchDevice'] is True, mobile_state
                          box = await canvas.bounding_box()
                          assert box, 'Canvas bounding box missing'
                          tap_position = {
                              'x': (846 / 1024) * box['width'],
                              'y': (592 / 768) * box['height']
                          }
                          await page.evaluate("""() => {
                              window.__macheteTouchDiag=[];
                              const canvas=document.querySelector('canvas');
                              ['pointerdown','pointerup','touchstart','touchend','mousedown','mouseup'].forEach(type=>{
                                  canvas.addEventListener(type,(event)=>{
                                      const point=event.touches?.[0] ?? event.changedTouches?.[0] ?? event;
                                      window.__macheteTouchDiag.push({
                                          type,
                                          x:point?.clientX ?? null,
                                          y:point?.clientY ?? null,
                                          pointerType:event.pointerType ?? null
                                      });
                                  }, {passive:true});
                              });
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              scene.input.on('gameobjectdown',(pointer,gameObject)=>{
                                  window.__macheteTouchDiag.push({
                                      type:'gameobjectdown',
                                      x:pointer.x,
                                      y:pointer.y,
                                      objectType:gameObject?.type ?? null,
                                      objectX:gameObject?.x ?? null,
                                      objectY:gameObject?.y ?? null,
                                      depth:gameObject?.depth ?? null
                                  });
                              });
                              scene.input.on('pointerdown',(pointer)=>{
                                  let hits=[];
                                  try {
                                      hits=(scene.input.hitTestPointer?.(pointer) ?? []).map(object=>({
                                          type:object?.type ?? null,
                                          x:object?.x ?? null,
                                          y:object?.y ?? null,
                                          depth:object?.depth ?? null,
                                          inputEnabled:object?.input?.enabled ?? null
                                      }));
                                  } catch(error) {
                                      hits=[{error:String(error)}];
                                  }
                                  window.__macheteTouchDiag.push({
                                      type:'phaser-pointerdown',
                                      x:pointer.x,
                                      y:pointer.y,
                                      wasTouch:pointer.wasTouch,
                                      hits
                                  });
                              });
                          }""")
                          await canvas.tap(position=tap_position)
                          await page.wait_for_timeout(150)
                          touch = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {
                                  calls:scene.__macheteTestCalls,
                                  attacking:scene.isAttacking,
                                  mobileAttack:scene.mobileInput?.attack,
                                  diag:window.__macheteTouchDiag
                              };
                          }""")
                          print('[MACHETE MOBILE TOUCH]', json.dumps(touch, sort_keys=True))

                          if touch['calls'] == 0:
                              await page.evaluate("""() => {
                                  const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  scene.cameras.main.disableCull=true;
                              }""")
                              await canvas.tap(position=tap_position)
                              await page.wait_for_timeout(150)
                              cull_patch = await page.evaluate("""() => {
                                  const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  return {
                                      calls:scene.__macheteTestCalls,
                                      attacking:scene.isAttacking,
                                      mobileAttack:scene.mobileInput?.attack,
                                      diag:window.__macheteTouchDiag
                                  };
                              }""")
                              print('[MACHETE MOBILE CULL PATCH]', json.dumps(cull_patch, sort_keys=True))

                          patched = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              if(scene.__macheteTestCalls>0) return {needed:false,calls:scene.__macheteTestCalls};
                              const attack=scene.children.list.find(
                                  object=>Math.abs((object?.x ?? -9999)-846)<1 &&
                                      Math.abs((object?.y ?? -9999)-592)<1 &&
                                      object?.input?.enabled
                              );
                              if(!attack) return {needed:true,error:'attack object missing'};
                              scene.input.setHitAreaCircle(attack, attack.displayOriginX, attack.displayOriginY, 48);
                              return {
                                  needed:true,
                                  type:attack.input?.hitArea?.type ?? null,
                                  x:attack.input?.hitArea?.x ?? null,
                                  y:attack.input?.hitArea?.y ?? null,
                                  radius:attack.input?.hitArea?.radius ?? null,
                                  callback:typeof attack.input?.hitAreaCallback,
                                  centerHit:attack.input?.hitAreaCallback?.(
                                      attack.input.hitArea,
                                      attack.displayOriginX,
                                      attack.displayOriginY,
                                      attack
                                  ) ?? null
                              };
                          }""")
                          print('[MACHETE MOBILE EXPLICIT HIT AREA]', json.dumps(patched, sort_keys=True))

                          if touch['calls'] == 0 and patched.get('needed'):
                              await canvas.tap(position=tap_position)
                              await page.wait_for_timeout(150)
                              explicit_hit = await page.evaluate("""() => {
                                  const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  return {
                                      calls:scene.__macheteTestCalls,
                                      attacking:scene.isAttacking,
                                      mobileAttack:scene.mobileInput?.attack,
                                      diag:window.__macheteTouchDiag
                                  };
                              }""")
                              print('[MACHETE MOBILE EXPLICIT HIT RESULT]', json.dumps(explicit_hit, sort_keys=True))

                          final_mobile = await page.evaluate("""() => {
                              const scene=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {calls:scene.__macheteTestCalls,attacking:scene.isAttacking};
                          }""")
                          assert final_mobile['calls'] == 1, {
                              'baseline':touch,
                              'final':final_mobile,
                              'patch':patched
                          }
                      finally:
                          await context.close()
                  finally:
                      await browser.close()

          asyncio.run(main())
          PY


  smoke-test-phase1:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup browser test tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright

      - name: Test Phase 1 runtime and jump stamina
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import time
          from playwright.async_api import async_playwright

          BASE = 'https://clienteemporio0001-arch.github.io/soldados-da-borracha/'

          def chrome_binary():
              candidates = [
                  '/opt/google/chrome/chrome',
                  '/opt/google/chrome/google-chrome',
                  shutil.which('google-chrome-stable'),
                  shutil.which('google-chrome'),
              ]
              for candidate in candidates:
                  if candidate and os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return candidate
              raise RuntimeError(f'No executable Chrome binary found: {candidates}')

          async def open_root(browser, touch=False):
              context = await browser.new_context(
                  viewport={'width': 1024, 'height': 768},
                  has_touch=touch
              )
              page = await context.new_page()
              errors = []
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.on('console', lambda msg: errors.append(msg.text) if msg.type == 'error' else None)
              url = BASE + '?audio-test=1&phase1-test=1&cache=' + str(time.time_ns())
              response = await page.goto(url, wait_until='networkidle', timeout=30000)
              assert response is not None and response.status == 200
              await page.wait_for_function(
                  "() => !!window.__soldadosAudioTestGame && window.__soldadosAudioTestGame.scene.isActive('MainMenu')",
                  timeout=30000
              )
              return context, page, errors

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      executable_path=chrome_binary(),
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage']
                  )
                  try:
                      # Desktop: use the real menu + phase selector pointer flow.
                      context, page, errors = await open_root(browser, touch=False)
                      try:
                          canvas = page.locator('canvas')
                          await canvas.click(position={'x': 512, 'y': 580})
                          await page.wait_for_function(
                              "() => window.__soldadosAudioTestGame.scene.isActive('LevelSelectScene')",
                              timeout=10000
                          )
                          await canvas.click(position={'x': 125, 'y': 452})
                          await page.wait_for_function(
                              """() => {
                                  const game=window.__soldadosAudioTestGame;
                                  const s=game.scene.getScene('Game');
                                  return !!s && s.scene.isActive() && !!s.player && !!s.staminaHud;
                              }""",
                              timeout=15000
                          )

                          before = await page.evaluate("""() => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {x:s.player.x, y:s.player.y, stamina:s.stamina, health:s.health};
                          }""")
                          await page.keyboard.down('ArrowRight')
                          await page.wait_for_timeout(260)
                          await page.keyboard.up('ArrowRight')
                          await page.wait_for_timeout(80)
                          moved = await page.evaluate("""() => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {x:s.player.x, y:s.player.y, stamina:s.stamina};
                          }""")
                          assert moved['x'] > before['x'], {'before':before,'moved':moved}

                          await page.wait_for_function(
                              """() => {
                                  const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  return !!s?.player?.body && (s.player.body.blocked.down || s.player.body.touching.down);
                              }""",
                              timeout=5000
                          )
                          await page.keyboard.down('Space')
                          await page.wait_for_timeout(90)
                          await page.keyboard.up('Space')
                          await page.wait_for_timeout(90)
                          jumped = await page.evaluate("""() => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {stamina:s.stamina, vy:s.player.body.velocity.y, firstJumpConsumed:s.firstJumpConsumed};
                          }""")
                          assert jumped['firstJumpConsumed'] is True, jumped
                          assert jumped['stamina'] <= before['stamina'] - 14.5, {'before':before,'jumped':jumped}
                          assert jumped['vy'] < 0, jumped

                          await page.wait_for_timeout(1600)
                          regenerated = await page.evaluate("""() => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {stamina:s.stamina, grounded:s.player.body.blocked.down || s.player.body.touching.down};
                          }""")
                          assert regenerated['stamina'] > jumped['stamina'], {'jumped':jumped,'regen':regenerated}
                          assert not errors, errors
                          print('[PHASE1 DESKTOP]', json.dumps({'before':before,'moved':moved,'jumped':jumped,'regenerated':regenerated}, sort_keys=True))
                      finally:
                          await context.close()

                      # Mobile: same Game jump pipeline, driven by mobileInput.jump.
                      context, page, errors = await open_root(browser, touch=True)
                      try:
                          await page.evaluate("""() => {
                              const game=window.__soldadosAudioTestGame;
                              game.scene.getScene('MainMenu').scene.start('Game');
                          }""")
                          await page.wait_for_function(
                              """() => {
                                  const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  return !!s && s.scene.isActive() && !!s.player && !!s.staminaHud && !!s.mobileInput;
                              }""",
                              timeout=15000
                          )
                          await page.wait_for_function(
                              """() => {
                                  const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                                  return !!s?.player?.body && (s.player.body.blocked.down || s.player.body.touching.down);
                              }""",
                              timeout=5000
                          )
                          mobile = await page.evaluate("""async () => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              const before=s.stamina;
                              s.mobileInput.jump=true;
                              await new Promise(r=>setTimeout(r,100));
                              s.mobileInput.jump=false;
                              await new Promise(r=>setTimeout(r,100));
                              return {
                                  before,
                                  after:s.stamina,
                                  firstJumpConsumed:s.firstJumpConsumed,
                                  vy:s.player.body.velocity.y
                              };
                          }""")
                          assert mobile['firstJumpConsumed'] is True, mobile
                          assert mobile['after'] <= mobile['before'] - 13.0, mobile
                          assert not errors, errors
                          print('[PHASE1 MOBILE]', json.dumps(mobile, sort_keys=True))
                      finally:
                          await context.close()
                  finally:
                      await browser.close()

          asyncio.run(main())
          PY


  smoke-test-stability:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup browser test tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright

      - name: Exercise all phases and scene transitions
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import time
          from playwright.async_api import async_playwright

          BASE = 'https://clienteemporio0001-arch.github.io/soldados-da-borracha/'

          PHASES = [
              ('Game', 125, 452),
              ('Level2Scene', 305, 352),
              ('Level3Scene', 500, 462),
              ('Level4Scene', 700, 347),
              ('Level5Scene', 890, 447),
          ]

          def chrome_binary():
              candidates = [
                  '/opt/google/chrome/chrome',
                  '/opt/google/chrome/google-chrome',
                  shutil.which('google-chrome-stable'),
                  shutil.which('google-chrome'),
              ]
              for candidate in candidates:
                  if candidate and os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return candidate
              raise RuntimeError(f'No Chrome binary found: {candidates}')

          async def wait_scene(page, key):
              await page.wait_for_function(
                  """key => {
                      const game=window.__soldadosAudioTestGame;
                      const s=game?.scene?.getScene?.(key);
                      return !!s && s.scene.isActive() && !!s.player;
                  }""",
                  arg=key,
                  timeout=20000
              )

          async def exercise_phase(page, key, seconds=60):
              errors = []
              page.on('pageerror', lambda err: errors.append('pageerror: '+str(err)))
              page.on('console', lambda msg: errors.append('console.error: '+msg.text) if msg.type == 'error' else None)

              await wait_scene(page, key)

              initial = await page.evaluate("""key => {
                  const s=window.__soldadosAudioTestGame.scene.getScene(key);
                  return {
                      x:s.player?.x ?? null,
                      y:s.player?.y ?? null,
                      health:s.health ?? null,
                      stamina:s.stamina ?? null
                  };
              }""", key)

              if key == 'Level2Scene':
                  await page.evaluate("""() => {
                      const s=window.__soldadosAudioTestGame.scene.getScene('Level2Scene');
                      s.startCurupiraEncounter?.();
                  }""")
              elif key == 'Level3Scene':
                  await page.evaluate("""() => {
                      const s=window.__soldadosAudioTestGame.scene.getScene('Level3Scene');
                      s.startCaboclinhoTrial?.();
                  }""")
              elif key == 'Level5Scene':
                  await page.evaluate("""() => {
                      const s=window.__soldadosAudioTestGame.scene.getScene('Level5Scene');
                      s.beginMapinguariReveal?.();
                  }""")

              start = time.monotonic()
              cycle = 0
              while time.monotonic() - start < seconds:
                  await page.keyboard.down('ArrowRight')
                  await page.wait_for_timeout(350)
                  await page.keyboard.up('ArrowRight')
                  await page.keyboard.press('Space')
                  await page.wait_for_timeout(180)
                  await page.keyboard.press('J')
                  await page.wait_for_timeout(500)

                  if cycle % 6 == 0:
                      await page.evaluate("""key => {
                          const s=window.__soldadosAudioTestGame.scene.getScene(key);
                          if (s?.player && !s.isPlayerDead && !s.phaseCompleted && typeof s.damagePlayer === 'function') {
                              s.damagePlayer(1, 0, 0);
                          }
                      }""", key)

                  cycle += 1

              final = await page.evaluate("""key => {
                  const s=window.__soldadosAudioTestGame.scene.getScene(key);
                  return {
                      active:s?.scene?.isActive?.() ?? false,
                      x:s?.player?.x ?? null,
                      y:s?.player?.y ?? null,
                      health:s?.health ?? null,
                      stamina:s?.stamina ?? null,
                      playerDead:s?.isPlayerDead ?? null,
                      phaseCompleted:s?.phaseCompleted ?? null,
                      bossStarted:s?.bossStarted ?? s?.arenaStarted ?? s?.caboclinhoTestActive ?? null
                  };
              }""", key)

              assert final['active'] is True, (key, final)
              assert not errors, (key, errors)
              print('[STABILITY]', key, json.dumps({'initial':initial,'final':final}, sort_keys=True))
              return initial, final

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      executable_path=chrome_binary(),
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage']
                  )
                  context = await browser.new_context(viewport={'width':1024,'height':768})
                  page = await context.new_page()
                  url = BASE + '?audio-test=1&stability-test=1&cache=' + str(time.time_ns())
                  response = await page.goto(url, wait_until='networkidle', timeout=30000)
                  assert response and response.status == 200
                  await page.wait_for_function(
                      "() => !!window.__soldadosAudioTestGame && window.__soldadosAudioTestGame.scene.isActive('MainMenu')",
                      timeout=30000
                  )
                  canvas = page.locator('canvas')

                  for index, (key, x, y) in enumerate(PHASES):
                      if not await page.evaluate("() => window.__soldadosAudioTestGame.scene.isActive('MainMenu')"):
                          await page.evaluate("""key => {
                              const game=window.__soldadosAudioTestGame;
                              const s=game.scene.getScene(key);
                              s?.cleanupSceneHazardsBeforeTransition?.();
                              s?.scene?.start?.('MainMenu');
                          }""", PHASES[index-1][0] if index else key)
                          await page.wait_for_function(
                              "() => window.__soldadosAudioTestGame.scene.isActive('MainMenu')",
                              timeout=10000
                          )

                      await canvas.click(position={'x':512,'y':580})
                      await page.wait_for_function(
                          "() => window.__soldadosAudioTestGame.scene.isActive('LevelSelectScene')",
                          timeout=10000
                      )
                      await canvas.click(position={'x':x,'y':y})
                      await exercise_phase(page, key, 60)

                      if key == 'Game':
                          stamina = await page.evaluate("""() => {
                              const s=window.__soldadosAudioTestGame.scene.getScene('Game');
                              return {stamina:s.stamina, cost:s.jumpStaminaCost};
                          }""")
                          assert stamina['cost'] == 15, stamina

                  await context.close()
                  await browser.close()

          asyncio.run(main())
          PY
