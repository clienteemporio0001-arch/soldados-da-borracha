name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Normalize WALK sprite
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/normalize_walk.py

      - name: Persist normalized WALK on main
        run: |
          if ! git diff --quiet -- public/assets/walk.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets/walk.png
            git commit -m "Normaliza walk para escala do idle [skip ci]"
            git push origin HEAD:main
          else
            echo "walk.png já está normalizado."
          fi

      - name: Build game
        run: npm run build

      - name: Verify machete audio in final build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for file in \
            public/assets/audio/player/blade_01.ogg \
            public/assets/audio/player/blade_02.ogg \
            dist/assets/audio/player/blade_01.ogg \
            dist/assets/audio/player/blade_02.ogg
          do
            test -s "$file"
            echo "VERIFY $file size=$(stat -c%s "$file")"
            ffprobe -hide_banner -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json "$file"
            ffmpeg -hide_banner -v error -i "$file" -f null -
          done
          test "$(sha256sum public/assets/audio/player/blade_01.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_01.ogg | cut -d' ' -f1)"
          test "$(sha256sum public/assets/audio/player/blade_02.ogg | cut -d' ' -f1)" = "$(sha256sum dist/assets/audio/player/blade_02.ogg | cut -d' ' -f1)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
