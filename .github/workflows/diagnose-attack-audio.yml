name: Diagnose attack audio

on:
  push:
    paths:
      - ".github/workflows/diagnose-attack-audio.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium

      - name: Analyze current asset
        run: |
          ffprobe -hide_banner -v error -show_entries format=duration,size -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json public/assets/audio/player/machete_swing_heavy.ogg
          ffmpeg -hide_banner -i public/assets/audio/player/machete_swing_heavy.ogg -af astats=metadata=1:reset=1 -f null - 2>&1 | grep -E 'Peak level dB|RMS level dB|Number of samples' | tail -6

      - name: Download and analyze CC0 sword candidates
        run: |
          set -e
          base="https://raw.githubusercontent.com/iW90/decadetes_game/ad5e475bace8e30726a5de2ff040143f62ad1293/assets/sound_effects/sword_attacks"
          for f in sword.4.ogg sword.5.ogg sword.6.ogg sword.10.ogg; do
            curl -L --fail --retry 3 "$base/$f" -o "/tmp/$f"
            echo "=== $f ==="
            ffprobe -hide_banner -v error -show_entries format=duration,size -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json "/tmp/$f"
            ffmpeg -hide_banner -i "/tmp/$f" -af astats=metadata=1:reset=1 -f null - 2>&1 | grep -E 'Peak level dB|RMS level dB|Number of samples' | tail -6
          done

      - name: Browser decode test
        run: |
          mkdir -p /tmp/webtest/assets
          cp public/assets/audio/player/machete_swing_heavy.ogg /tmp/webtest/assets/machete_swing_heavy.ogg
          cp /tmp/sword.4.ogg /tmp/webtest/assets/sword.4.ogg
          cp /tmp/sword.5.ogg /tmp/webtest/assets/sword.5.ogg
          cp /tmp/sword.6.ogg /tmp/webtest/assets/sword.6.ogg
          cp /tmp/sword.10.ogg /tmp/webtest/assets/sword.10.ogg
          cat > /tmp/webtest/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Audio decode test</title>
          <script>
          async function test(name) {
            try {
              const response = await fetch('/assets/' + name + '?v=1');
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const data = await response.arrayBuffer();
              const ctx = new AudioContext();
              const buffer = await ctx.decodeAudioData(data.slice(0));
              const source = ctx.createBufferSource();
              const gain = ctx.createGain();
              gain.gain.value = 0;
              source.buffer = buffer;
              source.connect(gain).connect(ctx.destination);
              source.start();
              return {name, ok:true, duration:buffer.duration, sampleRate:buffer.sampleRate, channels:buffer.numberOfChannels};
            } catch (error) {
              return {name, ok:false, error:String(error)};
            }
          }
          window.addEventListener('load', async () => {
            const names = ['machete_swing_heavy.ogg','sword.4.ogg','sword.5.ogg','sword.6.ogg','sword.10.ogg'];
            const results = [];
            for (const name of names) results.push(await test(name));
            document.body.textContent = JSON.stringify(results);
          });
          </script>
          HTML
          (cd /tmp/webtest && python3 -m http.server 4173 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          sleep 2
          chromium --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:4173/ | tee /tmp/browser-result.txt
          test "$(grep -o '"ok":false' /tmp/browser-result.txt | wc -l)" -eq 0
