name: Build jaguar roar v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jaguar-roar-v2.yml

permissions:
  contents: write

jobs:
  build-jaguar-roar-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install audio tooling
        run: |
          python -m pip install --disable-pip-version-check numpy soundfile

      - name: Download Freesound HQ preview
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.freesound.org/previews/263/263115_672090-hq.mp3" \
            -o /tmp/tiger_roar_hq.mp3
          test -s /tmp/tiger_roar_hq.mp3
          ls -lh /tmp/tiger_roar_hq.mp3

      - name: Build natural jaguar roar V2
        run: |
          python - <<'PY'
          import math
          import numpy as np
          import soundfile as sf

          source = "/tmp/tiger_roar_hq.mp3"
          output = "public/assets/audio/enemies/jaguar_roar_v2.ogg"
          target_rate = 44100
          duration_s = 1.80
          fade_in_s = 0.035
          fade_out_s = 0.12
          target_peak_db = -3.0

          audio, rate = sf.read(source, always_2d=True, dtype="float64")
          if audio.size == 0:
              raise SystemExit("Tiger source is empty")

          mono = audio.mean(axis=1)
          if rate != target_rate:
              old_x = np.linspace(0.0, 1.0, num=len(mono), endpoint=False)
              new_len = int(round(len(mono) * target_rate / rate))
              new_x = np.linspace(0.0, 1.0, num=new_len, endpoint=False)
              mono = np.interp(new_x, old_x, mono)
              rate = target_rate

          window = int(round(duration_s * rate))
          if len(mono) < window:
              raise SystemExit("Source shorter than requested roar segment")

          # Select the loudest 1.8 s window by RMS, stepping every 25 ms.
          step = max(1, int(round(0.025 * rate)))
          best_start = 0
          best_rms = -1.0
          for start in range(0, len(mono) - window + 1, step):
              segment = mono[start:start + window]
              rms = float(np.sqrt(np.mean(segment ** 2)))
              if rms > best_rms:
                  best_rms = rms
                  best_start = start

          segment = mono[best_start:best_start + window].copy()

          fade_in = int(round(fade_in_s * rate))
          fade_out = int(round(fade_out_s * rate))
          if fade_in > 1:
              segment[:fade_in] *= np.linspace(0.0, 1.0, fade_in)
          if fade_out > 1:
              segment[-fade_out:] *= np.linspace(1.0, 0.0, fade_out)

          peak = float(np.max(np.abs(segment)))
          if peak <= 1e-9:
              raise SystemExit("Selected tiger roar segment is silent")

          target_peak = 10 ** (target_peak_db / 20.0)
          segment *= target_peak / peak
          segment = np.clip(segment, -1.0, 1.0)

          sf.write(output, segment, rate, format="OGG", subtype="VORBIS")

          info = sf.info(output)
          decoded, decoded_rate = sf.read(output, always_2d=True, dtype="float64")
          decoded_peak = float(np.max(np.abs(decoded))) if decoded.size else 0.0
          decoded_rms = float(np.sqrt(np.mean(decoded ** 2))) if decoded.size else 0.0
          decoded_peak_db = 20 * math.log10(decoded_peak) if decoded_peak > 0 else -120.0
          decoded_rms_db = 20 * math.log10(decoded_rms) if decoded_rms > 0 else -120.0
          decoded_duration = len(decoded) / decoded_rate if decoded_rate else 0.0

          print(f"segment_start={best_start / rate:.3f}s")
          print(f"duration={decoded_duration:.3f}s")
          print(f"format={info.format}")
          print(f"subtype={info.subtype}")
          print(f"sample_rate={info.samplerate}")
          print(f"channels={info.channels}")
          print(f"peak_db={decoded_peak_db:.2f}")
          print(f"rms_db={decoded_rms_db:.2f}")

          if info.format != "OGG" or info.subtype != "VORBIS":
              raise SystemExit(f"Wrong codec/container: {info.format}/{info.subtype}")
          if info.samplerate != 44100 or info.channels != 1:
              raise SystemExit(f"Wrong audio format: {info.samplerate} Hz, {info.channels} ch")
          if not (1.3 <= decoded_duration <= 2.2):
              raise SystemExit(f"Wrong duration: {decoded_duration:.3f}s")
          if decoded_peak_db < -4.5:
              raise SystemExit(f"Roar too quiet: peak {decoded_peak_db:.2f} dB")
          if decoded_rms_db < -28:
              raise SystemExit(f"Roar too quiet by RMS: {decoded_rms_db:.2f} dB")
          PY

      - name: Update manifest onca logic and license
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path("src/game/audio/audioManifest.js")
          manifest = manifest_path.read_text()

          protected_keys = [
              "player_jump", "player_double_jump", "player_dash",
              "player_step_01", "player_step_02", "player_step_03", "player_step_04",
              "player_land", "fruit_bite", "snake_hiss", "carapana_buzz",
              "monkey_call", "monkey_throw"
          ]
          protected = {
              key: next(line for line in manifest.splitlines() if f"{key}:" in line)
              for key in protected_keys
          }

          old = "    jaguar_growl: { category: 'sfx', path: 'audio/enemies/jaguar_growl.ogg', license: 'CC0-1.0', gain: 0.86, rate: 0.82 },"
          new = old + "\n    jaguar_roar: { category: 'sfx', path: 'audio/enemies/jaguar_roar_v2.ogg', license: 'CC0-1.0', gain: 0.92, rate: 1.0 },"
          if "jaguar_roar:" not in manifest:
              if old not in manifest:
                  raise SystemExit("jaguar_growl manifest anchor not found")
              manifest = manifest.replace(old, new)

          for key, before in protected.items():
              after = next(line for line in manifest.splitlines() if f"{key}:" in line)
              if before != after:
                  raise SystemExit(f"Protected audio changed: {key}")

          manifest_path.write_text(manifest)

          onca_path = Path("src/game/oncaEncounter.js")
          text = onca_path.read_text()

          text = text.replace(
              "        this.nextEligibleAt = scene.time.now + 12000;\n",
              "        this.nextEligibleAt = scene.time.now + 12000;\n        this.distantRoarTimer = null;\n        this.distantRoarBlockedUntil = scene.time.now + 8000;\n"
          )

          text = text.replace(
              "        scene.events.once('shutdown', () => this.destroy());\n",
              "        this.scheduleDistantRoar();\n\n        scene.events.once('shutdown', () => this.destroy());\n"
          )

          text = text.replace(
              "        this.scene.audioManager?.playSfx?.('jaguar_growl', { cooldown: 1800, volume: 0.9 });",
              "        this.scene.audioManager?.playSfx?.('jaguar_roar', {\n            cooldown: 1800,\n            cooldownKey: 'jaguar_roar_warning',\n            volume: 0.95\n        });"
          )

          charge_old = "        this.scene.audioManager?.playSfx?.('jaguar_charge', { cooldown: 420, volume: 0.9 });\n        this.side = side;"
          charge_new = "        if (this.attackCount === 0) {\n            this.scene.audioManager?.playSfx?.('jaguar_roar', {\n                cooldown: 1200,\n                cooldownKey: 'jaguar_roar_first_charge',\n                volume: 0.72,\n                rate: 1.03\n            });\n        }\n        this.scene.audioManager?.playSfx?.('jaguar_charge', { cooldown: 420, volume: 0.9 });\n        this.side = side;"
          if charge_old not in text:
              raise SystemExit("startCharge anchor not found")
          text = text.replace(charge_old, charge_new)

          schedule_anchor = "    schedule (delay, callback)\n    {\n"
          distant_methods = """    scheduleDistantRoar ()\n    {\n        if (this.destroyed) return;\n        if (this.distantRoarTimer) {\n            this.distantRoarTimer.remove(false);\n            this.distantRoarTimer = null;\n        }\n\n        const delay = 24000 + Math.random() * 18000;\n        this.distantRoarTimer = this.scene.time.delayedCall(delay, () => {\n            this.distantRoarTimer = null;\n            this.tryDistantRoar();\n            this.scheduleDistantRoar();\n        });\n    }\n\n    tryDistantRoar ()\n    {\n        if (this.destroyed || this.active || this.state !== 'IDLE') return;\n        if (this.scene.isPlayerDead || this.scene.phaseCompleted) return;\n        if (this.scene.time.now < this.distantRoarBlockedUntil) return;\n\n        const eligibility = this.canSpawn() || {};\n        const allowed = typeof eligibility === 'boolean' ? eligibility : eligibility.allowed !== false;\n        const bossActive = typeof eligibility === 'object' && eligibility.bossActive === true;\n        if (!allowed) return;\n        if (Math.random() > 0.45) return;\n\n        const baseVolume = bossActive ? 0.28 : (0.32 + Math.random() * 0.10);\n        const rate = 0.94 + Math.random() * 0.06;\n        const detune = -80 + Math.random() * 60;\n\n        this.scene.audioManager?.playSfx?.('jaguar_roar', {\n            cooldown: 8000,\n            cooldownKey: 'jaguar_roar_distant',\n            volume: baseVolume,\n            rate,\n            detune\n        });\n    }\n\n"""
          if "    scheduleDistantRoar ()" not in text:
              if schedule_anchor not in text:
                  raise SystemExit("schedule method anchor not found")
              text = text.replace(schedule_anchor, distant_methods + schedule_anchor)

          cleanup_anchor = "        this.attackCount = 0;\n\n        if (startCooldown && !this.destroyed) {"
          cleanup_new = "        this.attackCount = 0;\n        this.distantRoarBlockedUntil = Math.max(this.distantRoarBlockedUntil, this.scene.time.now + 8000);\n\n        if (startCooldown && !this.destroyed) {"
          if cleanup_anchor not in text:
              raise SystemExit("cleanup anchor not found")
          text = text.replace(cleanup_anchor, cleanup_new)

          destroy_anchor = "        if (this.checkTimer) {\n            this.checkTimer.remove(false);\n            this.checkTimer = null;\n        }\n        this.cleanupActive(false);"
          destroy_new = "        if (this.checkTimer) {\n            this.checkTimer.remove(false);\n            this.checkTimer = null;\n        }\n        if (this.distantRoarTimer) {\n            this.distantRoarTimer.remove(false);\n            this.distantRoarTimer = null;\n        }\n        this.cleanupActive(false);"
          if destroy_anchor not in text:
              raise SystemExit("destroy anchor not found")
          text = text.replace(destroy_anchor, destroy_new)

          onca_path.write_text(text)

          licenses_path = Path("public/assets/audio/LICENSES.md")
          licenses = licenses_path.read_text()
          row = "| `enemies/jaguar_roar_v2.ogg` | `Tiger Roar` | lauramellis | https://freesound.org/people/lauramellis/sounds/263115/ | CC0 1.0 | Freesound; gravação real de tigre usada como vocalização de felino grande para a onça no jogo; corte de 1,8 s do preview HQ oficial, mono Vorbis 44.1 kHz |"
          if row not in licenses:
              licenses += "\n" + row + "\n"
              licenses_path.write_text(licenses)
          PY

      - name: Validate code and build
        run: |
          node --check src/game/oncaEncounter.js
          node --check src/game/audio/audioManifest.js
          npm ci
          npm run build
          git diff --check

          grep "jaguar_roar:" src/game/audio/audioManifest.js
          grep "jaguar_charge:" src/game/audio/audioManifest.js
          grep "player_jump:" src/game/audio/audioManifest.js
          grep "player_dash:" src/game/audio/audioManifest.js

      - name: Commit final jaguar audio and remove temporary workflow
        run: |
          rm .github/workflows/build-jaguar-roar-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/enemies/jaguar_roar_v2.ogg \
            src/game/audio/audioManifest.js \
            src/game/oncaEncounter.js \
            public/assets/audio/LICENSES.md \
            .github/workflows/build-jaguar-roar-v2.yml
          git commit -m "Melhora rugido e suspense da onca"
          git push origin HEAD:main
