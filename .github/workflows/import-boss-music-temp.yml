name: Import attached boss music

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-boss-music-temp.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact attached MP3 mirror
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://art-by-rk.weebly.com/uploads/1/4/9/1/149113633/dark-fight-music-boss-142794.mp3' \
            -o /tmp/boss.mp3
          echo '463e8a5e8bf2642e66c50cbde3d950f024b70c4793e2146d6b2e84c2df4d9344  /tmp/boss.mp3' | sha256sum -c -
          test "$(stat -c '%s' /tmp/boss.mp3)" = "4402782"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert exact MP3 to OGG Vorbis
        run: |
          set -euo pipefail
          ffmpeg -y -i /tmp/boss.mp3 -vn -c:a libvorbis -q:a 4 public/assets/audio/music/music_boss.ogg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/assets/audio/music/music_boss.ogg

      - name: Commit converted boss music
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/music/music_boss.ogg
          git commit -m "Replace boss music with Dark Fight Music Boss"
          git push
